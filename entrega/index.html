document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-content:space-between;align-items:center;gap:16px;\">\n        <div style=\"font-size:12px;letter-spacing:0.2em;text-transform:uppercase;\">{{ hoverTitle }}<\u002Fdiv>\n        <div data-hide-m=\"\" style=\"display:flex;gap:10px;\">\n          <div sc-camel-on-click=\"{{ rowPrev }}\" style=\"cursor:pointer;width:36px;height:36px;border-radius:50%;border:1px solid rgba(235,235,235,0.4);display:flex;align-items:center;justify-content:center;font-size:14px;\" style-hover=\"border-color:#EBEBEB;\">←<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ rowNext }}\" style=\"cursor:pointer;width:36px;height:36px;border-radius:50%;border:1px solid rgba(235,235,235,0.4);display:flex;align-items:center;justify-content:center;font-size:14px;\" style-hover=\"border-color:#EBEBEB;\">→<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div ref=\"{{ rowRef }}\" data-row=\"\" style=\"display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 56px;padding:10px 56px;scrollbar-width:none;\">\n        <sc-for list=\"{{ cards }}\" as=\"v\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ v.open }}\" sc-camel-on-mouse-enter=\"{{ v.hover }}\" style=\"flex:0 0 clamp(240px,27vw,400px);scroll-snap-align:start;cursor:pointer;position:relative;aspect-ratio:16/9;overflow:hidden;background:radial-gradient(120% 120% at 20% 0%, #2a2a2a 0%, #161616 60%) center/cover no-repeat;background-image:{{ v.thumbBg }};outline:1px solid {{ v.outline }};outline-offset:3px;transition:transform .35s ease;\" style-hover=\"transform:scale(1.03);\">\n            <div style=\"position:absolute;inset:0;background:linear-gradient(180deg, rgba(16,16,16,0) 40%, rgba(16,16,16,0.85) 100%);\"><\u002Fdiv>\n            <div style=\"position:absolute;left:16px;right:16px;bottom:14px;display:flex;flex-direction:column;gap:6px;\">\n              <div style=\"font-size:15px;letter-spacing:0.04em;\">{{ v.label }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:cen =\"border-top:1px solid oklch(78% 0 0);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"display:flex;flex-direction:column;gap:20px;max-width:380px;\">\n          <a href=\"{{ downloadUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;justify-content:space-between;align-items:center;background:#101010;color:#EBEBEB;padding:20px 24px;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;\">Descargar archivos <span style=\"font-size:18px;\">↓<\u002Fspan><\u002Fa>\n          <sc-if value=\"{{ guideUrl }}\" hint-placeholder-val=\"{{ true }}\">\n            <a href=\"{{ guideUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;justify-content:space-between;align-items:center;padding:0 0 14px;border-bottom:1px solid #101010;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;\">Ver guía de descarga <span style=\"font-size:18px;\">↗<\u002Fspan><\u002Fa>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <\u002Fsc-if>\n\n  <section id=\"resena\" data-screen-label=\"04 Reseña\" data-pad=\"\" style=\"background:#101010;color:#EBEBEB;padding:clamp(96px,12vw,160px) 56px 48px;min-height:{{ reviewMinH }};display:flex;flex-direction:column;justify-content:center;\">\n    <div style=\"max-width:1240px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:120px;\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px;\">\n        <div data-reveal=\"\" style=\"font-size:11px;letter-spacing:0.22em;text-transform:uppercase;\">{{ reviewKicker }}<\u002Fdiv>\n        <sc-if value=\"{{ reviewFormVisible }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:28px;width:100%;\">\n            <div data-reveal=\"\" style=\"font-family:'Romie',serif;font-style:italic;font-size:clamp(48px,7vw,96px);line-height:1.02;max-width:900px;text-wrap:balance;\">¿Nos cuentan qué sintieron?<\u002Fdiv>\n            <div data-reveal=\"\" style=\"font-size:17px;line-height:1.7;color:oklch(82% 0 0);max-width:520px;text-wrap:pretty;\">Si disfrutaron su película, una reseña nos ayuda a que más parejas nos encuentren. Las leemos todas.<\u002Fdiv>\n            <form data-reveal=\"\" sc-camel-on-submit=\"{{ onReviewSubmit }}\" style=\"width:min(100%,560px);display:flex;flex-direction:column;gap:26px;margin-top:16px;text-align:left;\">\n              <div style=\"display:flex;flex-direction:column;gap:12px;align-items:center;\">\n                <div style=\"display:flex;gap:6px;\">\n                  <sc-for list=\"{{ stars }}\" as=\"st\" hint-placeholder-count=\"5\">\n                    <div sc-camel-on-click=\"{{ st.set }}\" sc-camel-on-mouse-enter=\"{{ st.hover }}\" sc-camel-on-mouse-leave=\"{{ st.leave }}\" role=\"button\" aria-label=\"{{ st.label }}\" style=\"cursor:pointer;font-size:36px;line-height:1;padding:4px;color:{{ st.color }};transition:color .15s ease;\">★<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:oklch(70% 0 0);min-height:14px;\">{{ ratingLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <label style=\"display:flex;flex-direction:column;gap:10px;\">\n                <span style=\"font-size:11px;letter-spacing:0.18em;text-transform:uppercase;\">Su reseña<\u002Fspan>\n                <textarea rows=\"6\" value=\"{{ reviewText }}\" sc-camel-on-change=\"{{ onReviewText }}\" placeholder=\"Cuéntennos cómo fue trabajar con nosotros y qué sintieron al ver su película…\" style=\"width:100%;resize:vertical;background:#1a1a1a;border:1px solid #353535;color:#EBEBEB;padding:16px;font-family:'DM Sans';font-size:16px;line-height:1.6;outline:none;\"><\u002Ftextarea>\n              <\u002Flabel>\n              <label style=\"display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:14px;line-height:1.5;color:oklch(85% 0 0);\">\n                <input type=\"checkbox\" checked=\"{{ publishOk }}\" sc-camel-on-change=\"{{ onPublishOk }}\" style=\"width:18px;height:18px;margin:2px 0 0;accent-color:#EBEBEB;flex:none;\">\n                <span>Autorizamos a Cinema Norte a publicar esta reseña con nuestros nombres en su sitio web.<\u002Fspan>\n              <\u002Flabel>\n              <button type=\"submit\" style=\"display:flex;justify-content:space-between;align-items:center;width:100%;background:#EBEBEB;color:#101010;border:0;cursor:pointer;padding:20px 24px;font-family:'DM Sans';font-size:12px;letter-spacing:0.2em;text-transform:uppercase;\">{{ submitLabel }} <span style=\"font-size:16px;\">→<\u002Fspan><\u002Fbutton>\n              <div style=\"font-size:12px;color:oklch(70% 0.14 25);text-align:center;min-height:16px;\">{{ reviewError }}<\u002Fdiv>\n            <\u002Fform>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ reviewSent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:24px;\">\n            <div style=\"font-family:'Romie',serif;font-style:italic;font-size:clamp(48px,7vw,96px);line-height:1.02;\">Gracias.<\u002Fdiv>\n            <div style=\"font-size:17px;line-height:1.7;color:oklch(82% 0 0);max-width:480px;text-wrap:pretty;\">Recibimos su reseña. Fue un honor contar su historia.<\u002Fdiv>\n            <sc-if value=\"{{ hasGoogle }}\" hint-placeholder-val=\"{{ false }}\">\n              <a href=\"{{ reviewUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;justify-content:space-between;align-items:center;gap:40px;width:min(100%,340px);margin-top:12px;padding:0 0 14px;border-bottom:1px solid #EBEBEB;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;\">También en Google <span style=\"font-size:18px;\">↗<\u002Fspan><\u002Fa>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;border-top:1px solid #353535;padding-top:32px;\">\n        <img src=\"c8fde194-9f17-4c49-8528-183b80d1ea2d\" alt=\"Cinema Norte\" style=\"height:22px;filter:brightness(0) invert(1);\">\n        <div style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:oklch(70% 0 0);\">Stories in motion, endless memories<\u002Fdiv>\n        <a href=\"https://cinemanorte.com\" style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:oklch(70% 0 0);\">cinemanorte.com<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;coupleNames&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Andrea &amp; Rodrigo&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pareja&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;14 · 02 · 2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pareja&quot;},&quot;venue&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Hacienda La Joya, Torreón&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pareja&quot;},&quot;password&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pareja&quot;},&quot;coverImageUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Portada&quot;},&quot;loopVideoUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Portada&quot;},&quot;letterLead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Gracias por dejarnos estar tan cerca. Aquí está su día, tal como lo vivieron.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Textos&quot;},&quot;letterBody&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Escríbanles aquí un mensaje personal: algo que recuerden del día, un momento que les tocó, lo que sintieron al editar su película.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Textos&quot;},&quot;signature&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Equipo Cinema Norte&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Textos&quot;},&quot;filmIntro&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Busquen un buen momento, apaguen las luces y denle play. Esto es para verlo juntos.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Textos&quot;},&quot;downloadUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Enlaces&quot;},&quot;guideUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Enlaces&quot;},&quot;expires&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;14 · 05 · 2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Enlaces&quot;},&quot;reviewUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Enlaces&quot;},&quot;galleryVideos&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Teaser | https://galleries.vidflow.co/videos/scxo5rx8\\nResumen | https://galleries.vidflow.co/videos/wq7kv7xq\\nFilm | https://galleries.vidflow.co/videos/2584c1d2&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Videos (VidFlow)&quot;}}\">\nconst SB_URL = \"https://jrkemmxsjdjgautqbjvn.supabase.co\";\nconst SB_KEY = \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impya2VtbXhzamRqZ2F1dHFianZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5OTk4MjEsImV4cCI6MjEwNzU3NTgyMX0.dCwpAwrCAjs725LIQfRURr6RmU2m2FzxCi1OLrXwmoU\";\nconst imgUrl = (u) => {\n  if (!u) return \"\";\n  const m = u.match(/drive\\.google\\.com\\/(?:file\\/d\\/|open\\?id=|uc\\?(?:export=\\w+&)?id=|thumbnail\\?id=)([\\w-]{20,})/) || u.match(/[?&]id=([\\w-]{20,})/);\n  if (m && /google/.test(u)) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1920`;\n  const d = u.match(/^(https:\\/\\/www\\.dropbox\\.com\\/[^?]+)\\?(.*)$/);\n  if (d) return d[1] + \"?raw=1\";\n  return u;\n};\nconst DEFAULT_GALLERY = `Teaser | https://galleries.vidflow.co/videos/scxo5rx8\nResumen | https://galleries.vidflow.co/videos/wq7kv7xq\nFilm | https://galleries.vidflow.co/videos/2584c1d2`;\n\nclass Component extends DCLogic {\n  state = { hover: 0, modal: null, pwInput: \"\", pwError: \"\", unlocked: false };\n\n  readHash() {\n    try {\n      const m = location.hash.match(/[#&]d=([^&]+)/);\n      if (!m) return {};\n      const b = m[1].replace(/-/g, \"+\").replace(/_/g, \"/\");\n      return JSON.parse(decodeURIComponent(escape(atob(b))));\n    } catch (e) { return {}; }\n  }\n  hashData = this.readHash();\n  onHash = () => {\n    this.hashData = this.readHash();\n    if (this.hashData.coupleNames && this.state.remote === \"missing\") this.setState({ remote: \"ok\" });\n    else this.forceUpdate();\n  };\n  slug() {\n    const q = location.search.slice(1);\n    if (!q) return \"\";\n    const m = q.match(/(?:^|&)e=([^&]+)/);\n    if (m) return decodeURIComponent(m[1]).trim().toLowerCase();\n    const seg = q.split(\"&\").find((x) => x && !x.includes(\"=\") && x.toLowerCase() !== \"resena\");\n    return seg ? decodeURIComponent(seg).trim().toLowerCase() : \"\";\n  }\n  async loadRemote(slug) {\n    this.setState({ remote: \"loading\" });\n    try {\n      const r = await fetch(SB_URL + \"/rest/v1/rpc/get_entrega\", {\n        method: \"POST\",\n        headers: { apikey: SB_KEY, Authorization: \"Bearer \" + SB_KEY, \"Content-Type\": \"application/json\" },\n        body: JSON.stringify({ p_slug: slug }),\n      });\n      const d = r.ok ? await r.json() : null;\n      if (d && typeof d === \"object\") {\n        this.hashData = { ...d, ...this.readHash() };\n        if (d.coupleNames) document.title = \"Cinema Norte · \" + d.coupleNames;\n        this.setState({ remote: \"ok\" });\n      } else this.setState({ remote: \"missing\" });\n    } catch (e) { this.setState({ remote: \"missing\" }); }\n  }\n  componentDidMount() {\n    window.addEventListener(\"hashchange\", this.onHash);\n    const sl = this.slug();\n    if (sl && !this.hashData.coupleNames) this.loadRemote(sl);\n    if (this.hashData.coupleNames) document.title = \"Cinema Norte · \" + this.hashData.coupleNames;\n    try { if (sessionStorage.getItem(\"cn-entrega-\" + (this.props.password || \"\")) === \"1\") this.setState({ unlocked: true }); } catch (e) {}\n    this.io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add(\"is-visible\"); this.io.unobserve(e.target); } }), { threshold: 0.12 });\n    this.observe();\n    window.addEventListener(\"keydown\", this.onKey);\n  }\n  componentDidUpdate() { this.observe(); }\n  componentWillUnmount() { this.io && this.io.disconnect(); window.removeEventListener(\"keydown\", this.onKey); window.removeEventListener(\"hashchange\", this.onHash); }\n  observe() { document.querySelectorAll(\"[data-reveal]:not(.is-visible)\").forEach((el) => this.io.observe(el)); }\n\n  vimeo(raw) {\n    const m = (raw || \"\").match(/vimeo\\.com\\/(?:video\\/)?(\\d+)(?:\\/([a-z0-9]{6,}))?(?:[^\"'\\s]*?[?&]h=([a-z0-9]+))?/i);\n    if (!m) return null;\n    return { id: m[1], h: m[3] || m[2] || \"\" };\n  }\n  playerSrc(v, extra) {\n    const h = v.h ? `h=${v.h}&` : \"\";\n    return `https://player.vimeo.com/video/${v.id}?${h}${extra}&dnt=1&title=0&byline=0&portrait=0`;\n  }\n\n  rowRefs = {};\n  parseGallery() {\n    const raw = this.hashData.galleryVideos ?? this.props.galleryVideos ?? DEFAULT_GALLERY;\n    return raw.split(\"\\n\").map((l) => l.trim()).filter(Boolean).map((l) => {\n      const parts = l.split(\"|\").map((x) => x.trim()).filter(Boolean);\n      const urls = parts.filter((x) => /^https?:\\/\\//i.test(x));\n      const text = parts.filter((x) => !/^https?:\\/\\//i.test(x));\n      return { title: text[text.length - 1] || \"Video\", url: urls[0] || \"\", thumb: imgUrl(urls[1] || \"\") };\n    }).filter((v) => v.url);\n  }\n  onKey = (e) => {\n    if (this.state.modal == null) return;\n    const n = this.parseGallery().length;\n    if (e.key === \"Escape\") this.setState({ modal: null });\n    if (e.key === \"ArrowRight\") this.setState((s) => ({ modal: (s.modal + 1) % n }));\n    if (e.key === \"ArrowLeft\") this.setState((s) => ({ modal: (s.modal - 1 + n) % n }));\n  };\n  scrollRow(name, dir) {\n    const el = this.rowRefs[name];\n    if (el) el.scrollBy({ left: dir * el.clientWidth * 0.8, behavior: \"smooth\" });\n  }\n  renderVals() {\n    const p = { ...this.props, ...this.hashData };\n        const all = this.parseGallery();\n    const n = all.length;\n    const hv = this.state.hover ?? 0;\n    const hovered = all[Math.min(hv, n - 1)];\n    const mi = this.state.modal;\n    const mv = mi != null ? all[mi] : null;\n    const cards = all.map((v, i) => ({\n      label: `${i + 1}. ${v.title}`,\n      thumbBg: v.thumb ? `url(\"${v.thumb}\")` : \"radial-gradient(120% 120% at 20% 0%, #2a2a2a 0%, #161616 60%)\",\n      outline: i === hv ? \"rgba(235,235,235,0.9)\" : \"transparent\",\n      hover: () => this.state.hover !== i && this.setState({ hover: i }),\n      open: () => this.setState({ modal: i, hover: i }),\n    }));\n    const couple = p.coupleNames ?? \"Andrea & Rodrigo\";\n    const coverUrl = imgUrl(p.coverImageUrl || \"\");\n    const backdrop = hovered && hovered.thumb ? hovered.thumb : coverUrl;\n    const firstPoster = coverUrl ? null : all.find((x) => x.thumb);\n    const loop = this.vimeo(p.loopVideoUrl ?? \"\");\n    const coverBg = coverUrl ? `url(\"${coverUrl}\")` : (firstPoster ? `url(\"${firstPoster.thumb}\")` : \"none\");\n    const locked = !!p.password && !this.state.unlocked;\n\n    const rs = this.state.remote;\n    const reviewOnly = /(?:^|&)resena(?:[=&]|$)/i.test(location.search.slice(1));\n    const rating = this.state.rating || 0;\n    const shown = this.state.hoverStar || rating;\n    const LABELS = [\"\", \"Regular\", \"Bien\", \"Muy bien\", \"Excelente\", \"¡Increíble!\"];\n    const submitReview = async (e) => {\n      e.preventDefault();\n      if (this.state.sending) return;\n      if (!rating) return this.setState({ reviewError: \"Elijan una calificación con las estrellas.\" });\n      const text = (this.state.reviewText || \"\").trim();\n      if (text.length < 10) return this.setState({ reviewError: \"Escriban unas palabras sobre su experiencia.\" });\n      this.setState({ sending: true, reviewError: \"\" });\n      const row = { entrega_slug: this.slug() || null, couple: couple, rating, text, publish_ok: this.state.publishOk ?? true };\n      try {\n        const r = await fetch(SB_URL + \"/rest/v1/resenas\", {\n          method: \"POST\",\n          headers: { apikey: SB_KEY, Authorization: \"Bearer \" + SB_KEY, \"Content-Type\": \"application/json\", Prefer: \"return=minimal\" },\n          body: JSON.stringify(row),\n        });\n        if (!r.ok) throw new Error(await r.text());\n        fetch(\"https://api.web3forms.com/submit\", {\n          method: \"POST\",\n          headers: { \"Content-Type\": \"application/json\", Accept: \"application/json\" },\n          body: JSON.stringify({\n            access_key: \"d2425ae0-33de-4536-b093-91a961216e8b\",\n            subject: `Nueva reseña ${\"★\".repeat(rating)} — ${couple}`,\n            from_name: \"Cinema Norte — Entregas\",\n            Pareja: couple, Calificación: `${rating} de 5`, Reseña: text,\n            \"¿Se puede publicar?\": row.publish_ok ? \"Sí\" : \"No\",\n            Aprobar: \"Entra a cinemanorte.com/admin → Reseñas\",\n          }),\n        }).catch(() => {});\n        this.setState({ sending: false, sent: true });\n      } catch (err) { this.setState({ sending: false, reviewError: \"No se pudo enviar. Intenten de nuevo en un momento.\" }); }\n    };\n    return {\n      fullPage: !reviewOnly,\n      reviewMinH: reviewOnly ? \"100vh\" : \"auto\",\n      reviewKicker: reviewOnly ? couple : \"04 / Una última cosa\",\n      reviewFormVisible: !this.state.sent,\n      reviewSent: !!this.state.sent,\n      stars: [1, 2, 3, 4, 5].map((n) => ({\n        label: n + \" estrellas\",\n        color: n <= shown ? \"#EBEBEB\" : \"#3a3a3a\",\n        set: () => this.setState({ rating: n, reviewError: \"\" }),\n        hover: () => this.setState({ hoverStar: n }),\n        leave: () => this.setState({ hoverStar: 0 }),\n      })),\n      ratingLabel: LABELS[shown],\n      reviewText: this.state.reviewText || \"\",\n      onReviewText: (e) => this.setState({ reviewText: e.target.value, reviewError: \"\" }),\n      publishOk: this.state.publishOk ?? true,\n      onPublishOk: (e) => this.setState({ publishOk: e.target.checked }),\n      onReviewSubmit: submitReview,\n      submitLabel: this.state.sending ? \"Enviando…\" : \"Enviar reseña\",\n      reviewError: this.state.reviewError || \"\",\n      hasGoogle: !!p.reviewUrl,\n      remoteLoading: rs === \"loading\",\n      remoteMissing: rs === \"missing\",\n      couple,\n      date: p.date ?? \"14 · 02 · 2026\",\n      venue: p.venue ?? \"Hacienda La Joya, Torreón\",\n      signature: p.signature ?? \"Equipo Cinema Norte\",\n      letterLead: p.letterLead ?? \"Gracias por dejarnos estar tan cerca. Aquí está su día, tal como lo vivieron.\",\n      letterBody: p.letterBody ?? \"Escríbanles aquí un mensaje personal: algo que recuerden del día, un momento que les tocó, lo que sintieron al editar su película.\",\n      filmIntro: p.filmIntro ?? \"Busquen un buen momento, apaguen las luces y denle play. Esto es para verlo juntos.\",\n      expires: p.expires ?? \"14 · 05 · 2026\",\n      downloadUrl: p.downloadUrl || \"#\",\n      guideUrl: p.guideUrl ?? \"\",\n      reviewUrl: p.reviewUrl || \"#\",\n      coverBg,\n      loopSrc: loop ? this.playerSrc(loop, \"background=1&autoplay=1&loop=1&muted=1\") : \"\",\n      videoCount: n,\n      cards,\n      backdropBg: backdrop ? `url(\"${backdrop}\")` : \"none\",\n      hoverTitle: hovered ? `${Math.min(hv, n - 1) + 1}. ${hovered.title}` : \"\",\n      rowRef: (el) => { this.rowEl = el; },\n      rowPrev: () => this.rowEl && this.rowEl.scrollBy({ left: -this.rowEl.clientWidth * 0.8, behavior: \"smooth\" }),\n      rowNext: () => this.rowEl && this.rowEl.scrollBy({ left: this.rowEl.clientWidth * 0.8, behavior: \"smooth\" }),\n      modalOpen: !!mv,\n      modalLabel: mv ? `${mi + 1}. ${mv.title}` : \"\",\n      modalSrc: mv ? mv.url : \"\",\n      modalPos: mv ? `${mi + 1} / ${n}` : \"\",\n      closeModal: () => this.setState({ modal: null }),\n      stop: (e) => e.stopPropagation(),\n      prevVideo: () => n && this.setState((st) => ({ modal: (st.modal - 1 + n) % n })),\n      nextVideo: () => n && this.setState((st) => ({ modal: (st.modal + 1) % n })),\n      goFilm: (e) => { e.preventDefault(); const el = document.getElementById(\"pelicula\"); el && window.scrollTo({ top: el.offsetTop, behavior: \"smooth\" }); },\n      steps: [\n        { n: \"01\", text: \"Abran el enlace de descarga desde una computadora.\" },\n        { n: \"02\", text: \"Descarguen la carpeta completa en la máxima calidad.\" },\n        { n: \"03\", text: \"Guarden una copia en su computadora y otra en un disco o en la nube.\" },\n      ],\n      locked,\n      pwInput: this.state.pwInput,\n      pwError: this.state.pwError,\n      onPwChange: (e) => this.setState({ pwInput: e.target.value, pwError: \"\" }),\n      onUnlock: (e) => {\n        e.preventDefault();\n        if (this.state.pwInput.trim() === String(p.password).trim()) {\n          try { sessionStorage.setItem(\"cn-entrega-\" + p.password, \"1\"); } catch (err) {}\n          this.setState({ unlocked: true });\n        } else this.setState({ pwError: \"Contraseña incorrecta\" });\n      },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
