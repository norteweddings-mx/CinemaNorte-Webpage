<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;">
  <div style="font-family:'DM Sans';font-size:13px;letter-spacing:0.05em;text-transform:uppercase;line-height:1.4;min-height:2.8em;display:flex;align-items:flex-start;margin-bottom:16px;">{{ video.title }}</div>
  <div style="position:relative;aspect-ratio:16/9;background:repeating-linear-gradient(135deg, oklch(88% 0 0) 0px, oklch(88% 0 0) 20px, oklch(84% 0 0) 20px, oklch(84% 0 0) 40px);display:flex;align-items:center;justify-content:center;overflow:hidden;">
    <sc-if value="{{ video.embedUrl }}" hint-placeholder-val="{{ false }}">
      <iframe src="{{ video.embedUrl }}" style="position:absolute;inset:0;width:100%;height:100%;border:none;" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen="{{ true }}"></iframe>
      <div style="position:absolute;inset:0;background:rgba(0,0,0,0.12);pointer-events:none;"></div>
    </sc-if>
    <sc-if value="{{ noEmbed }}" hint-placeholder-val="{{ true }}">
      <div style="font-family:monospace;font-size:11px;color:oklch(45% 0 0);">[ VIDEO ]</div>
      <div style="position:absolute;top:14px;left:14px;width:26px;height:26px;border-radius:50%;border:1px solid oklch(30% 0 0 / 0.5);display:flex;align-items:center;justify-content:center;">
        <div style="width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid oklch(30% 0 0);margin-left:1px;"></div>
      </div>
    </sc-if>
  </div>
  <div style="font-family:'DM Sans';font-size:12px;letter-spacing:0.05em;text-transform:uppercase;color:oklch(50% 0 0);margin-top:16px;">{{ video.date }}</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:380},&quot;video&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;title&quot;:&quot;Ana &amp; Luis&quot;,&quot;date&quot;:&quot;2026&quot;},&quot;tsType&quot;:&quot;{title:string,date:string,embedUrl?:string}&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { noEmbed: !this.props.video?.embedUrl };
  }
}

</script>
</body>
</html>
