  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

      el.src = u + frag;

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

              const { done, value } = await reader.read();

              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

" },\n  { title: \"Naid & Roberto\", date: \"2025\", embedUrl: \"https://galleries.vidflow.co/videos/f63291b6\" },\n  { title: \"Sofía & Luis\", date: \"2025\", embedUrl: \"https://galleries.vidflow.co/videos/da2b8f37\" },\n  { title: \"Amaranta & Roberto\", date: \"2025\", embedUrl: \"https://galleries.vidflow.co/videos/eeab3038\" },\n  { title: \"Mariel & Josué\", date: \"2025\", embedUrl: \"https://galleries.vidflow.co/videos/jhl7ryde\" },\n];\n\nconst FAQS = [\n  { q: \"¿Cuánto tiempo tardan en entregar el video?\", a: \"El teaser (video corto) lo entregamos entre 2 y 3 semanas después de la boda. El video completo tarda entre 6 y 8 semanas.\" },\n  { q: \"¿Qué incluye el paquete básico?\", a: \"Cobertura del día completo, un video resumen de 3-5 minutos y la grabación editada de ceremonia y discursos.\" },\n  { q: \"¿Usan drone?\", a: \"Sí, cuando el lugar lo permite incluimos tomas aéreas para dar contexto y escala a la locación.\" },\n  { q: \"¿Trabajan fuera de Torreón?\", a: \"Por el momento nos enfocamos únicamente en bodas dentro de Torreón y la Comarca Lagunera.\" },\n  { q: \"¿Cómo reservamos la fecha?\", a: \"Con un anticipo de apartado una vez que confirmamos disponibilidad para su fecha.\" },\n  { q: \"¿Qué pasa si necesitamos cambiar la fecha?\", a: \"Entendemos que pasa. Movemos la reserva sin costo siempre que la nueva fecha esté disponible en nuestra agenda.\" },\n];\n\nconst SB_ANON = \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impya2VtbXhzamRqZ2F1dHFianZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5OTk4MjEsImV4cCI6MjEwNzU3NTgyMX0.dCwpAwrCAjs725LIQfRURr6RmU2m2FzxCi1OLrXwmoU\";\nconst TESTIMONIALS = [\n  { quote: \"Ver nuestro video fue como volver a vivir la boda completa. Cinema Norte capturó cosas que ni nosotros vimos ese día.\", name: \"Daniela & Rodrigo\" },\n  { quote: \"Nos hicieron sentir tranquilos todo el día. Ni nos acordábamos que nos estaban grabando.\", name: \"Melissa & Iván\" },\n  { quote: \"El video quedó tan cinematográfico que parece tráiler de película. Todos en la familia lo han visto mil veces.\", name: \"Paola & Sergio\" },\n];\n\nconst NAV_PAGES = [\n  { key: \"inicio\", label: \"Inicio\" },\n  { key: \"portafolio\", label: \"Portafolio\" },\n  { key: \"preguntas\", label: \"Preguntas\" },\n  { key: \"contacto\", label: \"Contacto\" },\n];\n\nclass Component extends DCLogic {\n  state = {\n    page: \"inicio\",\n    faqOpen: {},\n    form: { novia: \"\", novio: \"\", fecha: \"\", lugar: \"\", correo: \"\", telefono: \"\", origen: \"\", mensaje: \"\" },\n    formSent: false,\n    testimonialIndex: 0,\n    scrolled: false,\n    pageReady: false,\n    mobileMenuOpen: false,\n  };\n\n  toggleMobileMenu = () => this.setState(s => ({ mobileMenuOpen: !s.mobileMenuOpen }));\n\n  heroVideoRef = (el) => { if (el && el.src !== this.props.heroVideoUrl) el.src = this.props.heroVideoUrl || \"\"; };\n\n  componentDidMount() {\n    this.loadReviews();\n    this.onScroll = () => this.setState(s => s.scrolled === (window.scrollY > 400) ? null : { scrolled: window.scrollY > 400 });\n    window.addEventListener('scroll', this.onScroll);\n    this._observedReveal = new WeakSet();\n    this._revealObserver = new IntersectionObserver((entries) => {\n      entries.forEach(en => {\n        if (en.isIntersecting) { en.target.classList.add('is-visible'); this._revealObserver.unobserve(en.target); }\n      });\n    }, { threshold: 0.15 });\n    this.scanReveal();\n    const hasVimeo = /vimeo\\.com/i.test(this.props.heroVideoUrl || \"\");\n    if (hasVimeo) {\n      this.onVimeoMsg = (e) => {\n        if (!/vimeo\\.com$/.test((() => { try { return new URL(e.origin).hostname; } catch (x) { return \"\"; } })())) return;\n        let d = e.data; try { if (typeof d === \"string\") d = JSON.parse(d); } catch (x) { return; }\n        if (!d || !d.event) return;\n        if (d.event === \"ready\" && this.heroIframe) {\n          [\"play\", \"playProgress\"].forEach((v) => this.heroIframe.contentWindow.postMessage(JSON.stringify({ method: \"addEventListener\", value: v }), \"*\"));\n        }\n        if ((d.event === \"play\" || d.event === \"playProgress\") && !this.state.heroPlaying) this.setState({ heroPlaying: true, pageReady: true });\n      };\n      window.addEventListener(\"message\", this.onVimeoMsg);\n      setTimeout(() => this.setState({ pageReady: true }), 4000);\n      requestAnimationFrame(() => setTimeout(() => this.setState({ heroZoomed: true }), 50));\n    } else setTimeout(() => this.setState({ pageReady: true }), 350);\n  }\n  scanReveal = () => {\n    document.querySelectorAll('[data-reveal]').forEach(el => {\n      if (!this._observedReveal.has(el)) { this._observedReveal.add(el); this._revealObserver.observe(el); }\n    });\n  };\n  componentDidUpdate() {\n    this.scanReveal();\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n    this.onVimeoMsg && window.removeEventListener('message', this.onVimeoMsg);\n    this._revealObserver && this._revealObserver.disconnect();\n  }\n\n  testimonials() { return [...(this.state.liveReviews || []), ...TESTIMONIALS]; }\n  async loadReviews() {\n    try {\n      const r = await fetch(\"https://jrkemmxsjdjgautqbjvn.supabase.co/rest/v1/resenas?select=couple,text,rating&approved=eq.true&publish_ok=eq.true&order=created_at.desc&limit=12\", {\n        headers: { apikey: SB_ANON, Authorization: \"Bearer \" + SB_ANON },\n      });\n      if (!r.ok) return;\n      const rows = await r.json();\n      const liveReviews = rows.filter((x) => x.text).map((x) => ({\n        quote: x.text.length > 280 ? x.text.slice(0, 277).replace(/\\s+\\S*$/, \"\") + \"…\" : x.text,\n        name: (x.couple || \"Pareja\") + \"\",\n      }));\n      this.setState({ liveReviews, testimonialIndex: 0 });\n    } catch (e) {}\n  }\n  nextTestimonial = () => this.setState(s => ({ testimonialIndex: (s.testimonialIndex + 1) % this.testimonials().length }));\n  prevTestimonial = () => this.setState(s => ({ testimonialIndex: (s.testimonialIndex - 1 + this.testimonials().length) % this.testimonials().length }));\n\n  goTo = (page) => { this.setState({ page, mobileMenuOpen: false }); window.scrollTo(0, 0); };\n  toggleFaq = (i) => this.setState(s => ({ faqOpen: { ...s.faqOpen, [i]: !s.faqOpen[i] } }));\n  setField = (k, v) => this.setState(s => ({ form: { ...s.form, [k]: v } }));\n  submitForm = async (e) => {\n    e.preventDefault();\n    const f = this.state.form;\n    this.setState({ sending: true, formError: false });\n    fetch('https://jrkemmxsjdjgautqbjvn.supabase.co/rest/v1/leads', {\n      method: 'POST',\n      headers: { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON, 'Content-Type': 'application/json', Prefer: 'return=minimal' },\n      body: JSON.stringify({ data: f }),\n    }).catch(() => {});\n    try {\n      const res = await fetch('https://api.web3forms.com/submit', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },\n        body: JSON.stringify({\n          access_key: 'd2425ae0-33de-4536-b093-91a961216e8b',\n          subject: `Nueva solicitud de boda \\u2014 ${f.novia} & ${f.novio}`,\n          from_name: 'Cinema Norte \\u2014 Sitio web',\n          \"Novia\": f.novia, \"Novio\": f.novio, \"Fecha de la boda\": f.fecha, \"Lugar\": f.lugar,\n          \"Correo\": f.correo, \"Tel\\u00e9fono\": f.telefono, \"C\\u00f3mo se enteraron\": f.origen, \"Mensaje\": f.mensaje,\n        }),\n      });\n      const data = await res.json();\n      if (data.success) this.setState({ formSent: true, sending: false });\n      else this.setState({ formError: true, sending: false });\n    } catch (err) {\n      this.setState({ formError: true, sending: false });\n    }\n  };\n\n  renderVals() {\n    const page = this.state.page;\n    const accentPalette = this.props.accentMood ?? \"Medio\";\n    const accentColor = accentPalette === \"Suave\" ? \"#6b6b6b\" : accentPalette === \"Fuerte\" ? \"#101010\" : \"#353535\";\n    const headingStyle = (this.props.headingMood ?? \"Itálica poética\") === \"Recta editorial\" ? \"normal\" : \"italic\";\n    const bigPad = (this.props.rhythm ?? \"Espacioso\") === \"Compacto\" ? \"90px\" : \"170px\";\n    const navDark = page !== \"inicio\" || this.state.scrolled;\n    const navItems = NAV_PAGES.map(p => ({\n      key: p.key, label: p.label,\n      style: `font-family:'DM Sans';font-size:12px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;color:white;opacity:${p.key===page ? 1 : 0.6};`,\n      mobileOpacity: p.key === page ? 1 : 0.6,\n      onClick: () => this.goTo(p.key),\n    }));\n    const navItemsLeft = navItems.slice(0, 2);\n    const navItemsRight = navItems.slice(2);\n    const allVideos = VIDEO_TITLES;\n    const faqs = FAQS.map((f, i) => ({ ...f, open: !!this.state.faqOpen[i], sign: this.state.faqOpen[i] ? \"–\" : \"+\", onToggle: () => this.toggleFaq(i) }));\n    const onFieldChange = (k) => (e) => this.setField(k, e.target.value);\n    return {\n      logoSvg: { __html: LOGO_SVG },\n      navBg: navDark ? \"#101010\" : \"rgba(20,16,12,0.0)\",\n      navColor: \"white\",\n      navLogoFilter: \"brightness(0) invert(1)\",\n      navItems,\n      navItemsLeft,\n      navItemsRight,\n      isInicio: page === \"inicio\",\n      showFloatingCta: page !== \"inicio\",\n      isPortafolio: page === \"portafolio\",\n      isPreguntas: page === \"preguntas\",\n      isContacto: page === \"contacto\",\n      featuredVideos: allVideos.slice(0, 4),\n      allVideos,\n      faqs,\n      form: this.state.form,\n      formSent: this.state.formSent,\n      formNotSent: !this.state.formSent,\n      sending: !!this.state.sending,\n      formError: !!this.state.formError,\n      sendLabel: this.state.sending ? \"Enviando...\" : \"Enviar solicitud\",\n      goTo: this.goTo,\n      goToInicio: () => this.goTo(\"inicio\"),\n      goToPortafolio: () => this.goTo(\"portafolio\"),\n      goToPreguntas: () => this.goTo(\"preguntas\"),\n      goToContacto: () => this.goTo(\"contacto\"),\n      toggleFaq: this.toggleFaq,\n      setField: this.setField,\n      submitForm: this.submitForm,\n      onNoviaChange: onFieldChange(\"novia\"),\n      onNovioChange: onFieldChange(\"novio\"),\n      onFechaChange: onFieldChange(\"fecha\"),\n      onLugarChange: onFieldChange(\"lugar\"),\n      onCorreoChange: onFieldChange(\"correo\"),\n      onTelefonoChange: onFieldChange(\"telefono\"),\n      onOrigenChange: onFieldChange(\"origen\"),\n      onMensajeChange: onFieldChange(\"mensaje\"),\n      currentTestimonial: this.testimonials()[this.state.testimonialIndex % this.testimonials().length],\n      quoteSize: (() => {\n        const q = (this.testimonials()[this.state.testimonialIndex % this.testimonials().length] || {}).quote || \"\";\n        const narrow = typeof window !== \"undefined\" && window.innerWidth < 640;\n        if (q.length <= 110) return narrow ? \"22px\" : \"clamp(24px,3vw,34px)\";\n        if (q.length <= 190) return narrow ? \"19px\" : \"clamp(21px,2.5vw,28px)\";\n        return narrow ? \"16px\" : \"clamp(18px,2vw,23px)\";\n      })(),\n      onPrevTestimonial: this.prevTestimonial,\n      onNextTestimonial: this.nextTestimonial,\n      accentColor,\n      headingStyle,\n      bigPad,\n      tickerWords: Array.from({ length: 12 }, (_, i) => i),\n      heroVideoRef: this.heroVideoRef,\n      mobileMenuOpen: this.state.mobileMenuOpen,\n      toggleMobileMenu: this.toggleMobileMenu,\n      burgerLine1Transform: this.state.mobileMenuOpen ? \"translateY(6px) rotate(45deg)\" : \"translateY(0) rotate(0)\",\n      burgerLine2Opacity: this.state.mobileMenuOpen ? 0 : 1,\n      burgerLine3Transform: this.state.mobileMenuOpen ? \"translateY(-6px) rotate(-45deg)\" : \"translateY(0) rotate(0)\",\n      loaderOpacity: this.state.pageReady ? 0 : 1,\n      loaderPointerEvents: this.state.pageReady ? \"none\" : \"auto\",\n      ...(() => {\n        const raw = this.props.heroVideoUrl || \"\";\n        const m = raw.match(/vimeo\\.com\\/(?:video\\/)?(\\d+)(?:[^\"'\\s]*?[?&]h=([a-z0-9]+))?/i);\n        if (!m) return { heroVimeoSrc: \"\", heroMp4Url: raw, heroPosterBg: \"none\", onHeroLoad: null };\n        const h = m[2] ? `h=${m[2]}&` : \"\";\n        const poster = this.props.heroPosterUrl || `https://vumbnail.com/${m[1]}_large.jpg`;\n        return {\n          heroVimeoSrc: `https://player.vimeo.com/video/${m[1]}?${h}background=1&autoplay=1&loop=1&muted=1&dnt=1&quality=720p&api=1&player_id=hero`,\n          heroMp4Url: \"\",\n          heroPosterBg: `url(\"${poster}\")`,\n          heroIframeRef: (el) => { this.heroIframe = el; },\n          heroVideoOpacity: this.state.heroPlaying ? 1 : 0,\n          heroZoom: this.state.heroZoomed ? 1.06 : 1,\n        };\n      })(),\n      noHeroVideo: !this.props.heroVideoUrl,\n      heroFallbackTexture: this.props.heroVideoUrl ? \"\" : \", repeating-linear-gradient(135deg, oklch(30% 0 0) 0px, oklch(30% 0 0) 22px, oklch(26% 0 0) 22px, oklch(26% 0 0) 44px)\",\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
